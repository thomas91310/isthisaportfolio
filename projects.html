<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="description" content="Selected projects by Thomas Theissier." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Courier+Prime:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/vellum.css?v=10" />
    <script src="assets/js/theme.js?v=2"></script>
  </head>
  <body>
    <div class="site-chrome">
      <header class="site-header">
        <a class="site-brand" href="index.html">Thomas Theissier</a>
        <nav class="site-nav" aria-label="Primary">
          <a href="index.html" data-nav="home">Home</a>
          <a href="projects.html" data-nav="projects">Projects</a>
          <a href="writing/index.html" data-nav="writing">Writing</a>
          <a href="experience.html" data-nav="experience">Experience</a>
        </nav>
      </header>
      <div class="theme-bar">
        <button
          type="button"
          class="theme-toggle"
          data-theme-toggle
          aria-pressed="false"
          aria-label="Switch to night theme"
        >
          <span class="theme-toggle-kicker">mode</span>
          <span class="theme-toggle-track">
            <span class="theme-toggle-opt" data-opt="day">jour</span>
            <span class="theme-toggle-sep" aria-hidden="true">/</span>
            <span class="theme-toggle-opt" data-opt="night">nuit</span>
          </span>
        </button>
      </div>
    </div>

    <main class="site-main">
      <section class="page-section page-section--gallery">
        <header class="page-header page-header--center">
          <span class="kicker">Selected work</span>
          <h1 class="h1">Projects</h1>
        </header>

        <div class="project-gallery" data-project-gallery>
          <!-- programming stories -->
          <figure class="project-item">
            <a
            class="project-link"
            href="https://top-programming-stories.vercel.app/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="assets/projects/top-programming-stories.png"
              alt="Preview of the programming stories site"
              width="1344"
              height="840"
            />
            <span class="project-overlay" aria-hidden="true">
              <span class="project-overlay-title">programming stories</span>
              <span class="project-overlay-cta">Open →</span>
            </span>
            <span class="visually-hidden">Open programming broadsheet project</span>
          </a>
          </figure>

          <!-- 60th birthday menu -->
          <figure class="project-item">
            <a
              class="project-link"
              href="https://menu-60bday-qnubt3xrc-thomas91310s-projects.vercel.app/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="assets/projects/menu-60bday.png"
                alt="Preview of the 60th birthday menu site"
                width="1344"
                height="840"
              />
              <span class="project-overlay" aria-hidden="true">
                <span class="project-overlay-title">60th birthday menu</span>
                <span class="project-overlay-cta">Open →</span>
              </span>
              <span class="visually-hidden">Open 60th birthday menu project</span>
            </a>
          </figure>

          <!-- Eat The Road -->
          <figure class="project-item">
            <a
              class="project-link"
              href="https://eattheroad.com/index.php"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="assets/projects/eattheroad.png"
                alt="Preview of Eat The Road"
                width="1344"
                height="840"
              />
              <span class="project-overlay" aria-hidden="true">
                <span class="project-overlay-title">Eat The Road</span>
                <span class="project-overlay-cta">Open →</span>
              </span>
              <span class="visually-hidden">Open Eat The Road website</span>
            </a>
          </figure>
        </div>
      </section>

      <aside class="pin-annotation" aria-hidden="true">
        <span class="pin-note">02 / projects</span>
        <span class="pin-note">hover · click to open</span>
      </aside>
    </main>

    <script src="assets/js/main.js?v=4"></script>
  </body>
</html>
